[project]
name = "multi-agent-system"
version = "0.1.0"
description = "A modular, observable async multi-agent orchestration starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.149.0",
  "google-genai>=2.31.0",
  "openai[openai]>=2.54.0",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.5,<1"]

[project.scripts]
mas = "multi_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
